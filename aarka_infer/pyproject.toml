[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aarka-infer"
version = "1.0.0"
description = "AARKA Infer: High-Performance Dedicated Inference Serving Subsystem for AARKAA-3B"
readme = "README.md"
authors = [{ name = "Synthetix Analytics / AARKAAI Team" }]
license = { text = "Proprietary" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.2",
    "psutil>=5.9.0",
    "tokenizers>=0.15.0",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.2.70",
    "gguf>=0.6.0"
]
vllm = [
    "torch>=2.1.0",
    "vllm>=0.4.2"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0"
]

[project.scripts]
aarka-infer = "aarka_infer.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
