# ─── AARKAAI – Production Nginx Configuration (Microservices Stack) ───────────
# Load balances FastAPI instances and routes traffic cleanly inside the Docker cluster

upstream fastapi_backend {
    least_conn;
    server fastapi-app:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name synthetixanalytics.com www.synthetixanalytics.com 16.170.206.243;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name synthetixanalytics.com www.synthetixanalytics.com 16.170.206.243;

    # ─── SSL Certificates ─────────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/synthetixanalytics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetixanalytics.com/privkey.pem;

    # ─── SSL Protocol & Cipher Hardening ──────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Upload Size Limit ────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ─── Shared Proxy Settings ────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ─── SSE Streaming Endpoint ───────────────────────────────────────────────
    location /prompt/stream {
        proxy_pass http://fastapi_backend/prompt/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection '';
        add_header X-Accel-Buffering no;
    }

    # ─── Core API Endpoints ───────────────────────────────────────────────────
    location /prompt {
        proxy_pass http://fastapi_backend/prompt;
        proxy_read_timeout 600s;
    }

    location /auth/ {
        proxy_pass http://fastapi_backend/auth/;
    }

    location /health {
        proxy_pass http://fastapi_backend/health;
    }

    # ─── Strategy & Finance ───────────────────────────────────────────────────
    location /strategy {
        proxy_pass http://fastapi_backend/strategy;
        proxy_read_timeout 120s;
    }

    # ─── File Upload & Download ───────────────────────────────────────────────
    location /upload {
        proxy_pass http://fastapi_backend/upload;
        client_max_body_size 10m;
    }

    location /download/ {
        proxy_pass http://fastapi_backend/download/;
    }

    # ─── User Settings ────────────────────────────────────────────────────────
    location /settings {
        proxy_pass http://fastapi_backend/settings;
    }

    # ─── Subscription & Premium ───────────────────────────────────────────────
    location /subscription {
        proxy_pass http://fastapi_backend/subscription;
    }

    # ─── Monitoring & Admin ───────────────────────────────────────────────────
    location /metrics {
        proxy_pass http://fastapi_backend/metrics;
    }

    location /admin/ {
        proxy_pass http://fastapi_backend/admin/;
    }

    # ─── Frontend (Next.js) – Catch-all ───────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
