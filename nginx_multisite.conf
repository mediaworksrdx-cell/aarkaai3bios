# ─── Multi-Site Production Nginx Configuration for GCP ─────────────────────────

# 1. Synthetix Analytics & Aarkaa AI Backend
upstream fastapi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream synthetix_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream fingeniq_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ─── SYNTHETIX ANALYTICS & DEFAULT IP ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name synthetixanalytics.com www.synthetixanalytics.com 136.85.114.150;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE Streaming Endpoint
    location /prompt/stream {
        proxy_pass http://fastapi_backend/prompt/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection '';
        add_header X-Accel-Buffering no;
    }

    # API Endpoints routed to FastAPI
    location /prompt {
        proxy_pass http://fastapi_backend/prompt;
        proxy_read_timeout 600s;
    }

    location /auth/ {
        proxy_pass http://fastapi_backend/auth/;
    }

    location /health {
        proxy_pass http://fastapi_backend/health;
    }

    location /strategy {
        proxy_pass http://fastapi_backend/strategy;
    }

    location /upload {
        proxy_pass http://fastapi_backend/upload;
    }

    location /download/ {
        proxy_pass http://fastapi_backend/download/;
    }

    location /settings {
        proxy_pass http://fastapi_backend/settings;
    }

    location /subscription {
        proxy_pass http://fastapi_backend/subscription;
    }

    location /metrics {
        proxy_pass http://fastapi_backend/metrics;
    }

    location /admin/ {
        proxy_pass http://fastapi_backend/admin/;
    }

    # Synthetix Site (Next.js) Catch-All
    location / {
        proxy_pass http://synthetix_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── FINGENIQ.COM ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name fingeniq.com www.fingeniq.com;

    client_max_body_size 50M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # FinGenIQ Frontend (Next.js on Port 3001)
    location / {
        proxy_pass http://fingeniq_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
