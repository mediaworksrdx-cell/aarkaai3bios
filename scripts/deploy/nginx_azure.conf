# ─────────────────────────────────────────────────────────────
# 4. HTTP REDIRECTS FOR DOMAINS (PORT 80)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aarka-ai.com www.aarka-ai.com fingeniq.com www.fingeniq.com synthetixanalytics.com www.synthetixanalytics.com;

    return 301 https://$host$request_uri;
}

