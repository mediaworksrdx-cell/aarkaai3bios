# ─── AARKAAI – GCP Production Nginx Configuration ──────────────────────────────
upstream fastapi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ─── AARKAAI – GCP Production Nginx Configuration ──────────────────────────────
upstream fastapi_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP: Redirect all traffic to HTTPS (allow ACME challenge for Certbot)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 136.85.114.150 synthetixanalytics.com www.synthetixanalytics.com aarka-ai.com www.aarka-ai.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Production SSL Server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name synthetixanalytics.com www.synthetixanalytics.com aarka-ai.com www.aarka-ai.com 136.85.114.150;

    # SSL Certificates (Let's Encrypt / Managed)
    ssl_certificate /etc/letsencrypt/live/synthetixanalytics.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/synthetixanalytics.com/privkey.pem;

    # TLS Protocols & Cipher Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50M;

    # Shared Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE Streaming Endpoint
    location /prompt/stream {
        proxy_pass http://fastapi_backend/prompt/stream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Connection '';
        add_header X-Accel-Buffering no;
    }

    # API Endpoints
    location /prompt {
        proxy_pass http://fastapi_backend/prompt;
        proxy_read_timeout 600s;
    }

    location /auth/ {
        proxy_pass http://fastapi_backend/auth/;
    }

    location /health {
        proxy_pass http://fastapi_backend/health;
    }

    location /strategy {
        proxy_pass http://fastapi_backend/strategy;
        proxy_read_timeout 120s;
    }

    location /upload {
        proxy_pass http://fastapi_backend/upload;
        client_max_body_size 50M;
    }

    location /download/ {
        proxy_pass http://fastapi_backend/download/;
    }

    location /settings {
        proxy_pass http://fastapi_backend/settings;
    }

    location /subscription {
        proxy_pass http://fastapi_backend/subscription;
    }

    location /metrics {
        proxy_pass http://fastapi_backend/metrics;
    }

    location /admin/ {
        proxy_pass http://fastapi_backend/admin/;
    }

    location / {
        proxy_pass http://fastapi_backend/;
    }
}
