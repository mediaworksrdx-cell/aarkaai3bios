# ─── AARKAAI Production Microservices Container Topology ─────────────────────
# Separates Application Layer (FastAPI), Data Layer (MongoDB/Redis), and GPU AI Inference (vLLM)
# 
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d --build
# ───

version: "3.8"

services:
  # ─── 1. FastAPI Application Layer ───────────────────────────────────────────
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarkaai-fastapi-prod
    restart: always
    command: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:5000 --timeout 300
    environment:
      - AARKAAI_ENV=production
      - AARKAAI_PORT=5000
      - AARKAAI_WORKERS=4
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-aarkaai}
      - REDIS_URL=redis://redis:6379/0
      - VLLM_3B_URL=http://aarkaa-3b-vllm:8000/v1
      - VLLM_CODER_URL=http://aarkaa-coder-vllm:8001/v1
      - VISION_SERVICE_URL=http://aarkaa-vision:8002/v1
      - AARKAAI_SECRET_KEY=${AARKAAI_SECRET_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - VERTEX_PROJECT=${VERTEX_PROJECT:-orbital-heaven-504004-s2}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - GOOGLE_CSE_API_KEY=${GOOGLE_CSE_API_KEY}
      - GOOGLE_CSE_ID=${GOOGLE_CSE_ID}
    expose:
      - "5000"
    depends_on:
      - redis
    networks:
      - aarkaai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── 2. Redis Caching, Queueing & Rate-Limiting ────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: aarkaai-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - aarkaai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── 3. AARKAA 3B General LLM Service (vLLM GPU Node) ──────────────────────
  aarkaa-3b-vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        MODEL_NAME: aarkaa-ai/aarkaa-3b
        PORT: 8000
        GPU_MEMORY_UTILIZATION: "0.90"
        MAX_MODEL_LEN: 8192
    container_name: aarkaai-3b-vllm-prod
    restart: always
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_TOKEN}
    expose:
      - "8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aarkaai-network

  # ─── 4. AARKAA 7B Coder LLM Service (vLLM GPU Node) ────────────────────────
  aarkaa-coder-vllm:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        MODEL_NAME: aarkaa-ai/aarkaa-7b-coder
        PORT: 8001
        GPU_MEMORY_UTILIZATION: "0.90"
        MAX_MODEL_LEN: 8192
    container_name: aarkaai-coder-vllm-prod
    restart: always
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGINGFACE_TOKEN}
    expose:
      - "8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aarkaai-network

  # ─── 5. AARKAA Vision Microservice Node ────────────────────────────────────
  aarkaa-vision:
    build:
      context: .
      dockerfile: Dockerfile.vllm
      args:
        MODEL_NAME: aarkaa-ai/aarkaa-vision
        PORT: 8002
        GPU_MEMORY_UTILIZATION: "0.85"
    container_name: aarkaai-vision-prod
    restart: always
    expose:
      - "8002"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - aarkaai-network

  # ─── 6. Internal Gateway & SSL Proxy (Nginx) ────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aarkaai-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_site.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - fastapi-app
    networks:
      - aarkaai-network

networks:
  aarkaai-network:
    driver: bridge

volumes:
  redis-data:
